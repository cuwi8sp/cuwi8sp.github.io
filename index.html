<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>思考の保管庫 - cuwi</title>
  
  <!-- Tailwind CSS（デザイン）の読み込み -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Reactの読み込み -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel（プログラムをブラウザ向けに翻訳するツール）の読み込み -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* アニメーション用のカスタムCSS */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }
    .animate-zoom-in {
      animation: zoomIn 0.4s ease-out forwards;
    }
    /* スマホの下部余白対応 */
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 1rem);
    }
    /* スクロールバーのカスタマイズ（Webkit） */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a; 
    }
    ::-webkit-scrollbar-thumb {
      background: #334155; 
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569; 
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-300 font-sans selection:bg-indigo-900 selection:text-white">
  
  <!-- ここにReactアプリが描画されます -->
  <div id="root"></div>

  <!-- ここから下がアプリの仕組みです -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- アイコンコンポーネント ---
    const IconUser = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>;
    const IconVideo = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>;
    const IconLibrary = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m16 6 4 14"></path><path d="M12 6v14"></path><path d="M8 8v12"></path><path d="M4 4v16"></path></svg>;
    const IconLock = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>;
    const IconUnlock = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>;
    const IconWrench = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>;
    const IconChevronRight = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="9 18 15 12 9 6"></polyline></svg>;
    const IconChevronLeft = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="15 18 9 12 15 6"></polyline></svg>;

    // --- メインアプリ ---
    function App() {
      // タブの種類: 'profile' (トップ), 'deepProfile' (詳細), 'videos', 'premium', 'secret'
      const [activeTab, setActiveTab] = useState('profile');
      
      const [secretClicks, setSecretClicks] = useState(0);
      const [isSecretUnlocked, setIsSecretUnlocked] = useState(false);

      // タブが切り替わったら一番上にスクロールする
      useEffect(() => {
        window.scrollTo(0, 0);
      }, [activeTab]);

      const handleSecretClick = () => {
        if (isSecretUnlocked) return;
        const newCount = secretClicks + 1;
        setSecretClicks(newCount);
        if (newCount >= 3) {
          setIsSecretUnlocked(true);
          setActiveTab('secret');
          setSecretClicks(0);
        }
      };

      return (
        <div className="min-h-screen pb-24">
          {/* ヘッダー */}
          <header className="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 p-4 shadow-md">
            <div className="max-w-4xl mx-auto flex justify-between items-center">
              <div>
                <h1 className="text-xl font-bold text-slate-100 tracking-wider cursor-pointer" onClick={() => setActiveTab('profile')}>
                  思考の保管庫
                </h1>
                <p className="text-xs text-slate-400 mt-1">動画のまとめと、私についての少し深い話</p>
              </div>
              {isSecretUnlocked && (
                <div className="text-rose-400 flex items-center text-[10px] sm:text-xs border border-rose-900/50 bg-rose-950/30 px-2 py-1 rounded">
                  <IconUnlock size={12} className="mr-1" /> 裏モード解放中
                </div>
              )}
            </div>
          </header>

          <main className="max-w-4xl mx-auto p-4 sm:p-6">
            
            {/* =========================================
                トップページ：Concept & Intro
            ========================================= */}
            {activeTab === 'profile' && (
              <div className="space-y-10 animate-fade-in">
                
                {/* ヒーローセクション（アバターと名前） */}
                <div className="flex flex-col items-center text-center mt-6">
                  <div className="w-28 h-28 bg-gradient-to-tr from-indigo-500 via-purple-500 to-emerald-400 rounded-full p-1 mb-5 shadow-lg shadow-indigo-500/20 relative">
                    <div className="w-full h-full bg-slate-900 rounded-full flex items-center justify-center border-4 border-slate-900">
                      <IconUser size={48} className="text-slate-400" />
                    </div>
                  </div>
                  <h2 className="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-300 to-emerald-300 mb-2">
                    cuwi <span className="text-lg text-slate-400 font-normal">（キウイ）</span>
                  </h2>
                  <p className="text-slate-400 font-medium tracking-widest text-sm">クリエイター / 効率化愛好家</p>
                </div>

                {/* コンテンツカード群 */}
                <section className="space-y-6 text-slate-300 leading-relaxed text-sm sm:text-base">
                  
                  <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-md relative overflow-hidden group hover:border-slate-700 transition-colors">
                    <div className="absolute top-0 left-0 w-1 h-full bg-indigo-500"></div>
                    <h3 className="text-xl font-bold text-slate-100 mb-4 flex items-center">
                      Concept & Profile
                    </h3>
                    <p className="mb-4">
                      名前は、過去の活動名「いち」と、noteを始めた際の「クイン」を掛け合わせた造語です。
                    </p>
                    <p>
                      ビタミンカラーのような元気さと、鳥や動物のような愛着を感じてもらえる存在でありたいという願いを込めています。
                    </p>
                  </div>

                  <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-md relative overflow-hidden group hover:border-slate-700 transition-colors">
                    <div className="absolute top-0 left-0 w-1 h-full bg-emerald-500"></div>
                    <h3 className="text-xl font-bold text-slate-100 mb-4">
                      「効率」と「実験」のあいだで。
                    </h3>
                    <p>
                      20年以上の音楽制作経験を経て、現在はアンビエント（環境音楽）や生活に溶け込むBGMの制作、そしてNotebookLMなどのAIツールを活用した思考の整理術など、生活全般を「クリエイティブに効率化する」プロセスを発信しています。
                    </p>
                  </div>

                  <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-md relative overflow-hidden group hover:border-slate-700 transition-colors">
                    <div className="absolute top-0 left-0 w-1 h-full bg-amber-500"></div>
                    <h3 className="text-xl font-bold text-slate-100 mb-4">
                      発信のスタンス
                    </h3>
                    <p>
                      完成形だけを見せるのではなく、そこに至るまでの「未完成の試行錯誤」を公開する実験を行っています。私のアウトプットが、何かを作る人、あるいは日々の生活をより良くしたいと願う誰かにとって、小さな知恵やインスピレーションの源になることを願っています。
                    </p>
                  </div>

                </section>

                {/* 詳細ページへのボタン */}
                <div className="flex justify-center pt-6 pb-4">
                  <button 
                    onClick={() => setActiveTab('deepProfile')}
                    className="group relative flex items-center justify-center px-8 py-4 font-bold text-white transition-all duration-300 bg-indigo-600 rounded-full hover:bg-indigo-500 hover:shadow-[0_0_20px_rgba(79,70,229,0.4)] w-full sm:w-auto overflow-hidden"
                  >
                    <div className="absolute inset-0 w-full h-full bg-gradient-to-r from-indigo-600 to-purple-600 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                    <span className="relative z-10 mr-2 tracking-wide">▶︎ cuwiのさらに詳しい情報を知る</span>
                    <IconChevronRight size={20} className="relative z-10 group-hover:translate-x-1 transition-transform" />
                  </button>
                </div>

                {/* 隠しトリガー（目立たないように一番下に配置） */}
                <div className="text-center pt-8">
                  <p 
                    onClick={handleSecretClick}
                    className="inline-block text-xs text-slate-900 cursor-pointer select-none hover:text-slate-700 transition-colors"
                  >
                    ※
                  </p>
                  {secretClicks > 0 && secretClicks < 3 && (
                    <span className="block text-[10px] text-slate-700 mt-1">あと {3 - secretClicks} 回...</span>
                  )}
                </div>
              </div>
            )}

            {/* =========================================
                詳細ページ：Deep Profile
            ========================================= */}
            {activeTab === 'deepProfile' && (
              <div className="space-y-6 animate-fade-in pb-8">
                
                {/* 戻るボタン */}
                <button 
                  onClick={() => setActiveTab('profile')}
                  className="flex items-center text-slate-400 hover:text-white transition-colors mb-6 text-sm group"
                >
                  <IconChevronLeft size={18} className="mr-1 group-hover:-translate-x-1 transition-transform" />
                  Concept & Profile に戻る
                </button>

                <div className="flex items-center mb-8">
                  <div className="w-1.5 h-8 bg-gradient-to-b from-indigo-400 to-emerald-400 rounded-full mr-3"></div>
                  <h2 className="text-2xl sm:text-3xl font-bold text-slate-100">Deep Profile</h2>
                </div>

                <div className="space-y-6">
                  
                  {/* プロフィール詳細 */}
                  <section className="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-sm">
                    <h3 className="text-indigo-300 font-bold border-b border-slate-800 pb-3 mb-4 text-lg">■ プロフィール詳細</h3>
                    <p className="text-slate-300 text-sm sm:text-base leading-relaxed">
                      私は現在、在宅でのWebディレクターやクリエイター、作曲家、そしてYouTuberとして、心理学からプログラミングまで多岐にわたるテーマを横断しながら活動しています。
                    </p>
                  </section>

                  {/* 主な経歴と実績 */}
                  <section className="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-sm">
                    <h3 className="text-indigo-300 font-bold border-b border-slate-800 pb-3 mb-4 text-lg">■ 主な経歴と実績</h3>
                    <ul className="text-slate-300 space-y-4 text-sm sm:text-base">
                      <li className="flex items-start">
                        <span className="text-emerald-500 mr-2 mt-0.5">✓</span>
                        <div><span className="font-semibold text-slate-200">Webマーケティング・分析:</span> 視聴者心理の深い分析に基づき、過去に月収100万円を達成。</div>
                      </li>
                      <li className="flex items-start">
                        <span className="text-emerald-500 mr-2 mt-0.5">✓</span>
                        <div><span className="font-semibold text-slate-200">アナログの感性:</span> 飲食店でのアルバイト時代には、おすすめ商品のPOPや手書きメニューの作成を通じ、視覚的に伝える技術を磨きました。</div>
                      </li>
                      <li className="flex items-start">
                        <span className="text-emerald-500 mr-2 mt-0.5">✓</span>
                        <div className="w-full">
                          <span className="font-semibold text-slate-200 block mb-2">現在の活動:</span>
                          <ul className="list-disc list-inside bg-slate-950/50 p-4 rounded-lg space-y-2 text-slate-400">
                            <li>YouTubeチャンネルの全工程（企画・編集・デザイン）を1人で完結。</li>
                            <li>クラウドソーシングでの画像制作や、チャンネル運用。</li>
                            <li>NotebookLMやGeminiなどのAIを駆使した、情報の要約・自己分析・自動化の追求。</li>
                          </ul>
                        </div>
                      </li>
                    </ul>
                  </section>

                  {/* 保有スキル・得意分野 */}
                  <section className="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-sm">
                    <h3 className="text-indigo-300 font-bold border-b border-slate-800 pb-3 mb-4 text-lg">■ 保有スキル・得意分野</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div className="bg-slate-950/50 p-4 rounded-xl border border-slate-800/50">
                        <div className="font-bold text-slate-200 mb-2">音楽・音声</div>
                        <p className="text-sm text-slate-400">絶対音感を活かした耳コピ、オリジナルBGM・効果音制作。感情を乗せたナレーション。</p>
                      </div>
                      <div className="bg-slate-950/50 p-4 rounded-xl border border-slate-800/50">
                        <div className="font-bold text-slate-200 mb-2">デザイン</div>
                        <p className="text-sm text-slate-400">note「みんなのフォトギャラリー」での使用実績あり。</p>
                      </div>
                      <div className="bg-slate-950/50 p-4 rounded-xl border border-slate-800/50 sm:col-span-2">
                        <div className="font-bold text-slate-200 mb-2">書道</div>
                        <p className="text-sm text-slate-400">初段（デジタルの効率化を追及する一方で、伝統的な筆致も大切にしています）。</p>
                      </div>
                    </div>
                  </section>

                  {/* 性格・パーソナリティ */}
                  <section className="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-sm">
                    <h3 className="text-indigo-300 font-bold border-b border-slate-800 pb-3 mb-4 text-lg">■ 性格・パーソナリティ</h3>
                    <ul className="text-slate-300 space-y-4 text-sm sm:text-base">
                      <li className="flex flex-col sm:flex-row sm:items-baseline">
                        <span className="font-semibold text-slate-200 sm:w-1/3 shrink-0 mb-1 sm:mb-0">思考のベース:</span>
                        <span className="text-slate-400">INTJ（建築家）をベースに、ISTP（巨匠）の要素も併せ持つ「基礎データ派」。感覚や感情よりも、数字や事実を重んじます。</span>
                      </li>
                      <li className="flex flex-col sm:flex-row sm:items-baseline">
                        <span className="font-semibold text-slate-200 sm:w-1/3 shrink-0 mb-1 sm:mb-0">ギャップのある個性:</span>
                        <span className="text-slate-400">「おばあちゃん」のような落ち着いた言動と、ボーイッシュな「元俺っ子」の側面が同居しています。</span>
                      </li>
                      <li className="flex flex-col sm:flex-row sm:items-baseline">
                        <span className="font-semibold text-slate-200 sm:w-1/3 shrink-0 mb-1 sm:mb-0">スタンス:</span>
                        <span className="text-slate-400">自称ナルシストで自己肯定感は高いですが、承認欲求は控えめ。誰かの役に立つ作品作りに没頭する時間が幸福です。</span>
                      </li>
                    </ul>
                  </section>

                  {/* 創作へのこだわり */}
                  <section className="bg-gradient-to-br from-slate-900 to-indigo-950/30 border border-indigo-900/30 rounded-2xl p-6 shadow-sm">
                    <h3 className="text-indigo-300 font-bold border-b border-indigo-900/50 pb-3 mb-4 text-lg">■ 創作へのこだわり：情報の蒸留</h3>
                    <p className="text-slate-300 text-sm sm:text-base leading-relaxed">
                      情報をただ詰め込むのではなく、本当に必要な要素だけを残す<strong className="text-indigo-400 font-bold">「情報の蒸留（引き算）」</strong>を意識したコンテンツ作りを心がけています。
                    </p>
                  </section>

                  {/* このサイトについて */}
                  <section className="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-sm">
                    <h3 className="text-indigo-300 font-bold border-b border-slate-800 pb-3 mb-4 text-lg">■ このサイトについて（おわりに）</h3>
                    <div className="space-y-4 text-sm sm:text-base text-slate-300 leading-relaxed">
                      <p>
                        ここはYouTubeという巨大なプラットフォームから少し離れた、私個人の「書斎」のような場所です。過去の動画を整理し、動画では語りきれない深い思考や制作の裏側を共有するために作りました。
                      </p>
                      <div className="bg-slate-950 p-4 rounded-lg border-l-4 border-slate-700">
                        <p className="text-slate-400">
                          ちなみに、YouTubeのアナリティクスでは視聴者の8割以上がシニア層の男性という結果が出ています。当初は驚きましたが、今では彼らの深い探求心に支えられ、感謝しています。
                        </p>
                      </div>
                      <p>
                        ゆっくりと、ご自身のペースでこの書斎を楽しんでいただければ幸いです。
                      </p>
                    </div>
                  </section>

                </div>
              </div>
            )}

            {/* =========================================
                動画ライブラリ（現状維持）
            ========================================= */}
            {activeTab === 'videos' && (
              <div className="space-y-6 animate-fade-in">
                <div className="mb-6">
                  <h2 className="text-xl sm:text-2xl font-bold text-slate-100 flex items-center">
                    <IconVideo size={28} className="mr-3 text-blue-400" />
                    動画ライブラリ
                  </h2>
                  <p className="text-sm text-slate-400 mt-2">過去の動画をテーマごとに整理しています。気になったものからご覧ください。</p>
                </div>
                
                <div className="bg-slate-900/50 border-2 border-slate-800 border-dashed rounded-2xl p-12 flex flex-col items-center justify-center text-center">
                  <div className="w-16 h-16 bg-slate-800 rounded-full flex items-center justify-center mb-4">
                    <IconWrench size={32} className="text-slate-500" />
                  </div>
                  <h3 className="text-lg font-medium text-slate-300 mb-2">現在準備中です</h3>
                  <p className="text-sm text-slate-500 leading-relaxed">
                    皆様に見やすいように動画を整理しています。<br/>
                    公開までもうしばらくお待ちください。
                  </p>
                </div>
              </div>
            )}

            {/* =========================================
                プレミアムエリア（現状維持）
            ========================================= */}
            {activeTab === 'premium' && (
              <div className="space-y-6 animate-fade-in">
                <div className="mb-6">
                  <h2 className="text-xl sm:text-2xl font-bold text-slate-100 flex items-center">
                    <IconLibrary size={28} className="mr-3 text-amber-400" />
                    プレミアムエリア
                  </h2>
                  <p className="text-sm text-slate-400 mt-2">クリエイター活動を直接支援していただける方向けの、限定コンテンツです。</p>
                </div>

                <div className="bg-slate-900/50 border-2 border-slate-800 border-dashed rounded-2xl p-12 flex flex-col items-center justify-center text-center">
                  <div className="w-16 h-16 bg-slate-800 rounded-full flex items-center justify-center mb-4">
                    <IconLock size={32} className="text-slate-500" />
                  </div>
                  <h3 className="text-lg font-medium text-slate-300 mb-2">現在準備中です</h3>
                  <p className="text-sm text-slate-500 leading-relaxed">
                    こだわりの限定コンテンツを制作中です。<br/>
                    公開を楽しみにお待ちください。
                  </p>
                </div>
              </div>
            )}

            {/* =========================================
                裏プロフィール（内容変更）
            ========================================= */}
            {activeTab === 'secret' && isSecretUnlocked && (
              <div className="space-y-6 animate-zoom-in mt-4">
                <div className="bg-rose-950/20 border border-rose-900/50 rounded-2xl p-6 sm:p-8 shadow-2xl shadow-rose-900/10 relative overflow-hidden">
                  <IconUnlock size={160} className="absolute -right-10 -bottom-10 text-rose-900/10 -rotate-12" />
                  
                  <h2 className="text-2xl font-bold text-rose-400 mb-6 flex items-center relative z-10">
                    <span className="bg-rose-500 w-2 h-6 rounded-full mr-3 inline-block"></span>
                    裏・ノート
                  </h2>
                  
                  <div className="space-y-5 text-sm sm:text-base text-slate-300 relative z-10 leading-relaxed">
                    <p>
                      おや、見つけてしまいましたか。<br/>
                      ここまで辿り着いていただき、ありがとうございます。
                    </p>
                    <div className="p-5 bg-slate-950/60 rounded-xl border border-rose-900/30">
                      <p className="mb-3">
                        実は、サイトを公開した当初はここに「秘密のプロフィール」を書いていたのですが、先ほど表の「Deep Profile」に全部移動させちゃいました（笑）。
                      </p>
                      <p>
                        なので、<strong className="text-rose-300 font-normal">「もう特に隠すこともなくなってしまった」</strong>というのが正直なところです。
                      </p>
                    </div>
                    <p>
                      とはいえ、せっかく用意したこの隠し部屋。閉鎖してしまうのも勿体ないので、今後はここに<br/>
                      <span className="text-slate-400 italic">「表では言わないようなちょっとした裏話」</span> や <span className="text-slate-400 italic">「日々のとりとめもない呟き」</span><br/>
                      でもこっそり書いていこうかなと思っています。
                    </p>
                    <p className="text-xs text-slate-500 mt-6 pt-4 border-t border-rose-900/30">
                      ※更新頻度は未定ですが、時々覗きに来てみてくださいね。
                    </p>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* ボトムナビゲーション */}
          <nav className="fixed bottom-0 w-full bg-slate-900/95 backdrop-blur-md border-t border-slate-800 pb-safe z-50">
            <div className="max-w-4xl mx-auto flex justify-around">
              {/* 「私について」はprofileかdeepProfileの時にアクティブにする */}
              <NavButton 
                active={activeTab === 'profile' || activeTab === 'deepProfile'} 
                onClick={() => setActiveTab('profile')} 
                icon={<IconUser size={24} />} 
                label="私について" 
              />
              <NavButton 
                active={activeTab === 'videos'} 
                onClick={() => setActiveTab('videos')} 
                icon={<IconVideo size={24} />} 
                label="動画まとめ" 
              />
              <NavButton 
                active={activeTab === 'premium'} 
                onClick={() => setActiveTab('premium')} 
                icon={<IconLibrary size={24} />} 
                label="プレミアム" 
              />
              {isSecretUnlocked && (
                <NavButton 
                  active={activeTab === 'secret'} 
                  onClick={() => setActiveTab('secret')} 
                  icon={<IconUnlock size={24} />} 
                  label="裏ノート" 
                  isSecret={true} 
                />
              )}
            </div>
          </nav>
        </div>
      );
    }

    // ナビゲーションボタンコンポーネント
    function NavButton({ active, onClick, icon, label, isSecret }) {
      const colorClass = isSecret 
        ? (active ? 'text-rose-400' : 'text-slate-500 hover:text-rose-300') 
        : (active ? 'text-indigo-400' : 'text-slate-500 hover:text-slate-300');
        
      return (
        <button onClick={onClick} className={`flex flex-col items-center justify-center w-full py-3 space-y-1 transition-colors ${colorClass}`}>
          <div className={`${active ? 'scale-110' : ''} transition-transform duration-200`}>
            {icon}
          </div>
          <span className="text-[10px] sm:text-xs font-medium">{label}</span>
        </button>
      );
    }

    // Reactアプリのレンダリング処理
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
